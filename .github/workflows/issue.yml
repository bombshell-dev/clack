name: issue

on:
  issues:
    types: [opened, edited, labeled, reopened]

permissions: {}

jobs:
  backlog:
    if: github.event.action == 'edited' || github.event.action == 'labeled'
    uses: bombshell-dev/automation/.github/workflows/move-issue-to-backlog.yml@655ca52a65f643d8593705129155291df68287fe
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}

  project:
    if: github.event.action == 'opened' || github.event.action == 'reopened'
    uses: bombshell-dev/automation/.github/workflows/add-issue-to-project.yml@655ca52a65f643d8593705129155291df68287fe
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
