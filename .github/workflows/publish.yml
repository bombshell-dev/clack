name: Publish

on:
  push:
    branches: [main, v0]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    if: github.repository_owner == 'bombshell-dev'
    uses: bombshell-dev/automation/.github/workflows/publish.yml@655ca52a65f643d8593705129155291df68287fe
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      packages: write
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
