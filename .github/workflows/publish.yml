name: Publish

on:
  push:
    branches: [main, v0]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    if: github.repository_owner == 'bombshell-dev'
    uses: bombshell-dev/automation/.github/workflows/publish.yml@a08dd196d81296cd0a59d3616d973218e0371f13
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      packages: write
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
