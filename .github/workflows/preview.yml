name: Preview

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

jobs:
  preview:
    if: github.repository_owner == 'bombshell-dev'
    uses: bombshell-dev/automation/.github/workflows/preview.yml@655ca52a65f643d8593705129155291df68287fe
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    with:
      publish: "./packages/*"
      template: "./examples/*"
