name: Detect Agent

on:
  pull_request_target:
    types: [opened]
  workflow_dispatch: {}

permissions: {}

jobs:
  detect:
    if: github.repository_owner == 'bombshell-dev' && github.event_name != 'workflow_dispatch'
    uses: bombshell-dev/automation/.github/workflows/detect-agent.yml@655ca52a65f643d8593705129155291df68287fe
    permissions:
      issues: write
      pull-requests: write

  backfill:
    if: github.repository_owner == 'bombshell-dev' && github.event_name == 'workflow_dispatch'
    uses: bombshell-dev/automation/.github/workflows/detect-agent-backfill.yml@655ca52a65f643d8593705129155291df68287fe
    permissions:
      issues: write
      pull-requests: write
