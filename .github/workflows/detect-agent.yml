name: Detect Agent

on:
  pull_request_target:
    types: [opened]
  workflow_dispatch: {}

permissions: {}

jobs:
  detect:
    if: github.repository_owner == 'bombshell-dev' && github.event_name != 'workflow_dispatch'
    uses: bombshell-dev/automation/.github/workflows/detect-agent.yml@a08dd196d81296cd0a59d3616d973218e0371f13
    permissions:
      issues: write
      pull-requests: write

  backfill:
    if: github.repository_owner == 'bombshell-dev' && github.event_name == 'workflow_dispatch'
    uses: bombshell-dev/automation/.github/workflows/detect-agent-backfill.yml@a08dd196d81296cd0a59d3616d973218e0371f13
    permissions:
      issues: write
      pull-requests: write
