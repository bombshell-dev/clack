name: Format

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

jobs:
  format:
    if: github.repository_owner == 'bombshell-dev'
    uses: bombshell-dev/automation/.github/workflows/format.yml@655ca52a65f643d8593705129155291df68287fe
    permissions:
      contents: write
      pull-requests: write
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
