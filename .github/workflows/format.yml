name: Format

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

jobs:
  format:
    if: github.repository_owner == 'bombshell-dev'
    uses: bombshell-dev/automation/.github/workflows/format.yml@a08dd196d81296cd0a59d3616d973218e0371f13
    permissions:
      contents: write
      pull-requests: write
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
